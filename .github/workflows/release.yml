name: Publish Release

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: word-metadata-extractor.exe
            asset_name: app-windows.exe
          - os: macos-latest
            artifact_name: word-metadata-extractor
            asset_name: app-macos
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.14.6
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.6'

    - name: Install dependencies
      run: |
            python -m pip install --upgrade pip
            pip install pyinstaller pandas

    - name: Build with PyInstaller
      run: pyinstaller --onefile --name word-metadata-extractor word-metadata-extractor.py

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.artifact_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}